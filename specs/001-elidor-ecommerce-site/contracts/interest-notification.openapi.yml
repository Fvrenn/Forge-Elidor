openapi: 3.0.0
info:
  title: Custom Interest Notification API
  version: 1.0.0
  description: API for handling "Notify Me" requests for sold-out products.

paths:
  /store/interest-notifications:
    post:
      summary: Create an Interest Notification
      description: Submits a user's email address to be notified about a specific sold-out product.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: The email address of the user to notify.
                product_id:
                  type: string
                  description: The ID of the sold-out product the user is interested in.
              required:
                - email
                - product_id
      responses:
        '201':
          description: Successfully created the interest notification.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: The ID of the newly created notification record.
                  email:
                    type: string
                  product_id:
                    type: string
                  created_at:
                    type: string
                    format: date-time
        '400':
          description: Bad Request - Invalid input, such as a malformed email or missing product_id.
        '422':
          description: Unprocessable Entity - For example, if the product is not actually sold out or does not exist.
